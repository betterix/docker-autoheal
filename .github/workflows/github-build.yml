name: build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Prune old orphaned untagged images
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: docker-autoheal
        run: |
          ENDPOINT="/user/packages/container/${PACKAGE_NAME}/versions"
          if ! gh api "$ENDPOINT" >/dev/null 2>&1; then
            ENDPOINT="/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions"
          fi

          TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO_OWNER}/${PACKAGE_NAME}:pull" | jq -r .token)
          ACTIVE_DIGESTS=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${REPO_OWNER}/${PACKAGE_NAME}/manifests/latest" | \
            jq -r '.manifests[]?.digest // empty')

          if [ -z "$ACTIVE_DIGESTS" ]; then
            echo "Could not resolve active platform digests for latest; skipping pruning."
            exit 0
          fi

          echo "Protecting active platform manifests:"
          echo "$ACTIVE_DIGESTS"

          gh api "$ENDPOINT" --paginate --jq '.[] | select(.metadata.container.tags | length == 0) | {id: .id, name: .name}' | \
          jq -c . | while read -r item; do
            VER_ID=$(echo "$item" | jq -r .id)
            VER_NAME=$(echo "$item" | jq -r .name)
            if echo "$ACTIVE_DIGESTS" | grep -q "$VER_NAME"; then
              echo "Keeping active platform manifest: $VER_NAME"
            else
              echo "Deleting obsolete untagged manifest: ID $VER_ID ($VER_NAME)"
              gh api --method DELETE "${ENDPOINT}/${VER_ID}" || true
            fi
          done
